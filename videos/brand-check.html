<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<script src="../lib/motion.js"></script>
<style>
  #stage { width: 1920px; height: 1080px; }

  .eyebrow {
    position: absolute; left: 120px; top: 96px;
    font: 500 26px/1 var(--font-body);
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    position: absolute; left: 116px; top: 134px; margin: 0;
    font: 700 112px/1 var(--font-display);
    letter-spacing: -0.03em;
  }
  h1 b { font-weight: inherit; }
  h1 span { color: var(--accent); }

  /* Color swatches */
  #swatches {
    position: absolute; left: 120px; right: 120px; top: 330px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px;
  }
  .swatch { will-change: transform, opacity; }
  .chip {
    height: 250px; border-radius: 20px;
    box-shadow: inset 0 0 0 2px #2a2a2e; /* keeps the black chip visible on black */
  }
  .name { margin-top: 24px; font: 600 34px/1.1 var(--font-display); }
  .hex  { margin-top: 8px; font: 400 26px/1.1 var(--font-body); color: var(--muted); letter-spacing: 0.04em; }

  /* Type specimens */
  #type {
    position: absolute; left: 120px; right: 120px; top: 770px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
    border-top: 2px solid #2a2a2e; padding-top: 44px;
  }
  .spec { display: flex; gap: 36px; align-items: center; will-change: transform, opacity; }
  .aa { font-size: 150px; line-height: 0.8; font-weight: 700; letter-spacing: -0.04em; }
  .spec .role { font: 500 22px/1 var(--font-body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
  .spec .fname { margin-top: 12px; font-size: 48px; line-height: 1; }
  .spec .sample { margin-top: 14px; font-size: 26px; line-height: 1.3; color: var(--muted); }
  .display { font-family: var(--font-display); }
  .body    { font-family: var(--font-body); }
</style>
</head>
<body>
<div id="stage">
  <div class="eyebrow" id="eyebrow">Brand check</div>
  <h1 id="title"><b id="brand-name"></b><span>.</span></h1>

  <div id="swatches">
    <div class="swatch" data-var="--bg"><div class="chip"></div><div class="name">Background</div><div class="hex"></div></div>
    <div class="swatch" data-var="--ink"><div class="chip"></div><div class="name">Text</div><div class="hex"></div></div>
    <div class="swatch" data-var="--muted"><div class="chip"></div><div class="name">Muted</div><div class="hex"></div></div>
    <div class="swatch" data-var="--accent"><div class="chip"></div><div class="name">Accent</div><div class="hex"></div></div>
  </div>

  <div id="type">
    <div class="spec display">
      <div class="aa">Aa</div>
      <div>
        <div class="role">Headline</div>
        <div class="fname" style="font-weight:700">Space Grotesk</div>
        <div class="sample">Bold ideas, set in motion.</div>
      </div>
    </div>
    <div class="spec body">
      <div class="aa">Aa</div>
      <div>
        <div class="role">Body</div>
        <div class="fname" style="font-weight:600">Inter</div>
        <div class="sample">The quick brown fox jumps over the lazy dog.</div>
      </div>
    </div>
  </div>
</div>
<script>
  window.DURATION = 5;
  window.SIZE = [1920, 1080];

  const { tween, ease } = window.motion;
  const $ = (s) => document.querySelector(s);

  // Swatch colors and labels come straight from brand.css.
  const root = getComputedStyle(document.documentElement);
  const swatches = [...document.querySelectorAll('.swatch')];
  swatches.forEach((s) => {
    const v = root.getPropertyValue(s.dataset.var).trim();
    s.querySelector('.chip').style.background = v;
    s.querySelector('.hex').textContent = v.toUpperCase();
  });
  $('#brand-name').textContent = window.motion.brand('name');
  const specs = [...document.querySelectorAll('.spec')];

  const rise = (el, t, start, dist = 60, dur = 0.7) => {
    el.style.opacity = tween(t, start, start + dur * 0.6, 0, 1);
    el.style.transform = `translateY(${tween(t, start, start + dur, dist, 0, ease.outExpo)}px)`;
  };

  window.render = (t) => {
    rise($('#eyebrow'), t, 0.1, 30);
    rise($('#title'), t, 0.2, 50);
    swatches.forEach((s, i) => rise(s, t, 0.8 + i * 0.15, 80));
    $('#type').style.borderTopColor = `rgba(42,42,46,${tween(t, 1.7, 2.1, 0, 1)})`;
    specs.forEach((s, i) => rise(s, t, 2.0 + i * 0.2, 50));
  };
</script>
</body>
</html>
